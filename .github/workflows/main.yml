name: Daily Central Asia Brief

on:
  schedule:
    # 每天 00:17 UTC = 北京时间 08:17
    - cron: '17 0 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: '重新生成当天简报（覆盖已有同日文章）'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: daily-brief
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate daily brief
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ vars.OPENAI_BASE_URL }}
          NEWS_PROVIDER: ${{ vars.NEWS_PROVIDER }}
          NEWS_MODEL: ${{ vars.NEWS_MODEL }}
        run: node newsbot/run.mjs ${{ github.event.inputs.force == 'true' && '--force' || '' }}

      - name: Commit and push
        run: |
          git config user.name "chk-newsbot"
          git config user.email "actions@users.noreply.github.com"
          git add news insights.html insights.xml sitemap.xml insights
          if git diff --cached --quiet; then
            echo "没有需要提交的变更（可能今日已发布或未配置密钥）"
            exit 0
          fi
          git commit -m "news: $(TZ=Asia/Shanghai date +%Y-%m-%d) 每日中亚简报"
          git push
